<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1C5DAA">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Domus Laterani by JFM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: app-style single column (max 600px) — photo hero, then one tab at a time, bottom tab bar like a native app */
:root{
  --paper:#F3F6FB; --card:#FFFFFF; --ink:#13203A; --muted:#58647E; --line:#DCE3EF;
  --brand:#1C5DAA; --brand-ink:#FFFFFF; --flame:#E9572A; --flame-soft:#FDEBE3; --brand-soft:#E6EEF9;
  --warn-bg:#FFF4DA; --warn-ink:#6B4A00; --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 20px rgba(19,32,58,.06);
  --mA:#E8541C; --mB:#1F5BA6; --mC:#2A9D4B;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1322; --card:#151F36; --ink:#E8EDF7; --muted:#9BA7C2; --line:#253151;
  --brand:#78A8EC; --brand-ink:#0C1322; --flame:#FF7B4D; --flame-soft:#3A2016; --brand-soft:#1A2A4A;
  --warn-bg:#3A2E10; --warn-ink:#F7D98A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1322; --card:#151F36; --ink:#E8EDF7; --muted:#9BA7C2; --line:#253151;
  --brand:#78A8EC; --brand-ink:#0C1322; --flame:#FF7B4D; --flame-soft:#3A2016; --brand-soft:#1A2A4A;
  --warn-bg:#3A2E10; --warn-ink:#F7D98A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:34px;height:34px;flex:none}
.brandname{display:flex;flex-direction:column;min-width:0;flex:1}
.brandname b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandname span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* hero */
.hero{position:relative;margin-top:14px;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-height:420px;width:100%;background:var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,34,0) 35%,rgba(8,16,34,.78) 100%)}
.hero-txt{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hero-txt .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.hero-txt h1{font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.03em;margin-top:4px}
.hero-txt h1 em{font-style:normal;color:#FF8A5E}
.hero-txt p{font-size:14px;opacity:.92;margin-top:4px}

.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:-1px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.facts div{padding:12px 10px;text-align:center;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* sections */
.sec{margin-top:28px}
.sec>h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sec>.lead{color:var(--muted);margin-top:6px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--flame);font-weight:600;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* quick actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.qa svg{width:22px;height:22px;color:var(--brand)}
.qa b{font-weight:600;font-size:15px}
.qa span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qa.hot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qa.hot svg,.qa.hot span{color:var(--brand-ink)}

/* wifi */
.wifi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.wifi .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wifi .val{font-family:var(--f-mono);font-weight:700;font-size:17px;overflow-wrap:anywhere;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.flame{background:var(--flame);border-color:var(--flame);color:#fff}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* steps */
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);counter-increment:s}
.step::before{content:counter(s);position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:16px}
.step h3{font-size:18px;font-weight:800;letter-spacing:-.01em;padding-left:44px;min-height:32px;display:flex;align-items:center}
.step p{margin-top:6px}
.shots{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shots button{flex:0 0 auto;border:0;padding:0;background:none;cursor:zoom-in;scroll-snap-align:start;border-radius:10px;overflow:hidden}
.shots img{display:block;height:180px;width:auto;max-width:none;border-radius:10px;background:var(--line)}
.code{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.code .k{width:44px;height:52px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:24px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.code .k.arrow{background:var(--flame);color:#fff}
.code .cap{font-size:13px;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);margin-top:12px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.note{border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px;background:var(--warn-bg);color:var(--warn-ink)}
.note b{font-weight:600}
.tip{border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px;background:var(--brand-soft)}

/* key sets */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.keyset{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.keyset h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.keyset ul{margin:0;padding-left:18px;font-size:13.5px}

/* lists */
.where{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.where div{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.where div:first-child{border-top:0}
.where dt{font-weight:600;font-size:14.5px}
.where dd{margin:0;font-size:14.5px;color:var(--muted);min-width:0}
.rooms{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.room .shots{margin:0;padding:12px 12px 0}
.room .shots img{height:150px}
.room .body{padding:12px 16px 16px}
.room h3{font-size:18px;font-weight:800}
.room ul{margin:8px 0 0;padding-left:18px}
.room li+li{margin-top:4px}

/* places */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:14px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plist{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plist li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.plist li:first-child{border-top:0}
.plist .nm{font-weight:600;min-width:0}
.plist .fav{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--flame-soft);color:var(--flame);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;font-weight:700}
.plist .meta{grid-column:1;font-size:13.5px;color:var(--muted)}
.plist .go{grid-row:1/3;grid-column:2}
.plist .mins{font-variant-numeric:tabular-nums}
.route{list-style:none;margin:12px 0 0;padding:0;position:relative}
.route li{position:relative;padding:0 0 14px 28px}
.route li::before{content:"";position:absolute;left:6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:3px solid var(--flame)}
.route li::after{content:"";position:absolute;left:10.5px;top:20px;bottom:0;width:1px;background:var(--line)}
.route li:last-child::after{display:none}
.route a{font-weight:600;text-decoration:none}
.route span{display:block;font-size:14px;color:var(--muted)}
.itin{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.itin .card h3{font-size:19px;font-weight:800}
.itin .when{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.fact{margin-top:10px;font-size:14px;border-left:3px solid var(--flame);padding-left:10px;color:var(--muted)}
.metro{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:#fff;font-weight:800;font-size:13px;font-family:var(--f-display);vertical-align:-4px;margin-right:4px}
.metro.A{background:var(--mA)}.metro.B{background:var(--mB)}.metro.C{background:var(--mC)}
.tlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.tlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.tlist .ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.tlist .ic svg{width:18px;height:18px}
.tlist b{display:block}
.tlist span{font-size:14px;color:var(--muted)}

/* contact */
.contact{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.sel{user-select:all;font-family:var(--f-mono);font-size:15px}
.emerg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.emerg div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.emerg b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--flame)}
.emerg span{font-size:12.5px;color:var(--muted)}
.qr{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.qr #qrbox{width:112px;height:112px;background:#fff;border-radius:10px;padding:6px}
.qr #qrbox img,.qr #qrbox canvas{width:100%!important;height:100%!important}

footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--flame)}

/* chooser */
.choose{display:grid;gap:14px;margin-top:20px}
.house{display:block;position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;max-width:100%;text-decoration:none;color:#fff}
.house img{width:100%;height:100%;object-fit:cover;display:block}
.house::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,34,0) 40%,rgba(8,16,34,.8))}
.house div{position:absolute;left:16px;bottom:14px;z-index:1}
.house b{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.house span{display:block;font-size:14px;opacity:.9}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,10,20,.92);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .28s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (max-width:380px){.where div{grid-template-columns:1fr;gap:2px}.keys{grid-template-columns:1fr}}

.pl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.dists{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.dist{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--brand);font-weight:600;font-variant-numeric:tabular-nums}
.dist svg{width:15px;height:15px;flex:none}
.route .dists{margin-top:4px}
.nearbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.nearbar a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--brand-soft);border-radius:12px;text-decoration:none;color:var(--ink);min-width:0}
.nearbar span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearbar b{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.nearbar b svg{width:16px;height:16px;color:var(--brand)}
.h3s{font-size:18px;font-weight:800}
.cases{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.case-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.case-h svg{width:20px;height:20px;color:var(--flame)}
.fares{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
.fares div{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fares div.ours{border-color:var(--flame);background:var(--flame-soft)}
.fares small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fares b{font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--ink)}
.fares span{font-size:12.5px;color:var(--muted)}
.ref{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.taxrow{display:flex;gap:12px;align-items:center}
.taxrow b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--flame);flex:none}
.lang button{padding:5px 8px}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.qrcard img{width:100%;max-width:150px;aspect-ratio:1;background:#fff;border-radius:10px;padding:6px}
.qrcard b{font-family:var(--f-display);font-size:16px;font-weight:800;margin-top:4px}
.qrcard span{font-size:12.5px;color:var(--muted)}
.qrimg{width:112px;height:112px;background:#fff;border-radius:10px;padding:6px}
#recensione{scroll-margin-top:72px}
.finds{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.find{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.find:first-child{border-top:0}
.find b{display:block;font-size:15px}
.find div span{display:block;font-size:14px;color:var(--muted)}

function fmtM(m){ return m>=1000 ? (m/1000).toFixed(1).replace(".",LANG==="en"?".":",")+" km" : m+" m"; }
function dist(k, opts={}){
  const d = DIST[k]; if(!d) return "";
  const far = d.walk > 25;
  let s = "";
  if(!far || opts.alwaysWalk) s += `<span class="dist">${IC.walk}${d.walk} ${L(UI.min)} · ${fmtM(d.m)}</span>`;
  if(far && VIA[k]) s += `<span class="dist">${IC.train}${L(VIA[k])}</span>`;
  else if(!far && VIA[k] && opts.showVia) s += `<span class="dist">${IC.train}${L(VIA[k])}</span>`;
  if(far) s += `<span class="dist">${IC.taxi}${L({it:"taxi",en:"taxi",es:"taxi"})} ~${d.taxiMin} ${L(UI.min)} · €${d.taxi[0]}–${d.taxi[1]}</span>`;
  return `<span class="dists">${s}</span>`;
}

/* ---------- distanza tra due punti (stima a piedi, come per la casa) ---------- */
function legKm(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h))*1.2; }
function legHTML(from,to){ if(!LL[from]||!LL[to]) return ""; const km=legKm(LL[from],LL[to]), min=Math.max(1,Math.round(km*1000/78));
  if(min>30) return `<span class="leg">${IC.taxi}${L({it:"dalla tappa precedente: meglio in taxi o metro",en:"from the previous stop: best by taxi or metro",es:"desde la parada anterior: mejor en taxi o metro"})}</span>`;
  return `<span class="leg">${IC.walk}${min} ${L(UI.min)} ${L({it:"dalla tappa precedente",en:"from the previous stop",es:"desde la parada anterior"})}</span>`; }

      </section>
    <section class="sec"><h2>${L({it:"Condividete la guida",en:"Share this guide",es:"Compartid la guía"})}</h2>
      <div class="card mt qr"><img class="qrimg" src="img/qr-guide.svg" alt="QR"><p class="small">${L({it:"Fate inquadrare il QR ai vostri compagni di viaggio: avranno tutto anche loro sul telefono.",en:"Let your travel companions scan the QR code: they'll have everything on their phone too.",es:"Que vuestros compañeros de viaje escaneen el QR: tendrán todo también en su móvil."})}</p></div></section>
    <section class="sec"><div class="card"><b>JFM · ${L({it:"Ospitalità a Roma",en:"Hospitality in Rome",es:"Hospitalidad en Roma"})}</b>
      <p class="small muted mt">${L({it:"Fabio e Alessandro, nel quartiere di San Giovanni.",en:"Fabio and Alessandro, in the San Giovanni neighbourhood.",es:"Fabio y Alessandro, en el barrio de San Giovanni."})}</p>
      <div class="row mt"><a class="btn" href="https://jfmitalia.com/" target="_blank" rel="noopener">jfmitalia.com</a></div></div></section>`;
}

/* ---------- router ---------- */
const TABS=["home","arrivo","casa","roma","info"];
const TAB_IC={home:IC.home,arrivo:IC.key,casa:IC.sofa,roma:IC.map,info:svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/>')};
function parseHash(){ const t=(location.hash||"").replace("#","").toLowerCase(); REVIEW_PLAT = t==="recensione-airbnb"?"airbnb":t==="recensione-booking"?"booking":null; TAB = (t.startsWith("recensione")||t==="faq") ? "info" : (TABS.includes(t) ? t : "home"); }
function footer(){ return `<footer><b>JF MANAGEMENT S.r.l.s.</b><span>P.IVA 06271030659 · Via Santi Martiri Salernitani 31, Salerno</span><span>jfmitalia.com</span></footer>`; }
function render(){
  document.documentElement.lang=LANG;
  ["it","en","es"].forEach(l=>document.getElementById("lang-"+l).setAttribute("aria-pressed",LANG===l));
  segN=0;
  const c=CFG?.casa||null;
  document.getElementById("navIn").innerHTML=TABS.map(t=>`<button type="button" data-tab="${t}" ${t===TAB?'aria-current="page"':""}>${TAB_IC[t]}<span>${L(UI.tabs[t])}</span></button>`).join("");
  const v={home:vHome,arrivo:vArrivo,casa:vCasa,roma:vRoma,info:vInfo}[TAB](c);
  MAPS.forEach(m=>{try{m.remove()}catch(_){}}); MAPS=[];
  document.getElementById("main").innerHTML=`<div class="view">${v}</div>${footer()}`;
  if(TAB==="home") drawMap("map-home", HOUSE.mapPts);
  if(TAB==="roma" && romaSub==="food") drawMap("map-food", [...FOOD.sg.items,...FOOD.col.items].map(([k,fav])=>[k, fav?"fav":"food", ""]));
}

/* ---------- eventi ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-go],[data-sub],[data-seg-btn],[data-copy],[data-zoom]"); if(!t) return;
  if(t.dataset.tab||t.dataset.go){ const tab=t.dataset.tab||t.dataset.go; if(t.dataset.sub2) romaSub=t.dataset.sub2; history.replaceState(null,"",tab==="home"?location.pathname+location.search:"#"+tab); TAB=tab; render();
    const a=t.dataset.anchor&&document.getElementById(t.dataset.anchor); if(a){ a.scrollIntoView(); } else window.scrollTo(0,0); }
  else if(t.dataset.sub){ romaSub=t.dataset.sub; render(); }
  else if(t.dataset.segBtn){ const k=t.dataset.segBtn,i=t.dataset.i;
    document.querySelectorAll(`[data-seg-btn="${k}"]`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.i===i));
    document.querySelectorAll(`[data-seg-pane="${k}"]`).forEach(p=>p.hidden=p.dataset.i!==i); }
  else if(t.dataset.copy!==undefined){ const txt=t.dataset.copy, done=()=>toast(L(UI.copied));
    try{ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }catch(_){ fallbackCopy(txt,done); } }
  else if(t.dataset.zoom){ document.getElementById("lbImg").src=t.dataset.zoom; document.getElementById("lb").hidden=false; }
});
function fallbackCopy(txt,done){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(_){} ta.remove(); }
document.addEventListener("input",e=>{ if(e.target.id==="faq-q"){ FAQ_Q=e.target.value; document.getElementById("faq-list").innerHTML=faqHTML(CFG?.casa); } });
document.getElementById("lb").addEventListener("click",()=>{document.getElementById("lb").hidden=true});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("lb").hidden=true; });
let toastT; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1600); }
function setLang(l){ LANG=l; try{localStorage.setItem("jfm-lang",l)}catch(_){} render(); }
["it","en","es"].forEach(l=>document.getElementById("lang-"+l).onclick=()=>setLang(l));
window.addEventListener("hashchange",()=>{parseHash();render();});
(function start(){
  let saved=null; try{saved=localStorage.getItem("jfm-lang")}catch(_){}
  const nav=(navigator.language||"").toLowerCase();
  LANG = saved || (nav.startsWith("it")?"it":nav.startsWith("es")?"es":"en");
  parseHash(); render();
  if(location.hash.startsWith("#recensione")||location.hash==="#faq") setTimeout(()=>document.getElementById(location.hash.startsWith("#faq")?"faq":"recensione")?.scrollIntoView(),50);
  /* config: prima la copia salvata (funziona offline), poi quella aggiornata dalla rete */
  try{ const saved=localStorage.getItem("jfm-cfg-"+HOUSE.key); if(saved){ CFG=JSON.parse(saved); render(); } }catch(_){}
  fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ CFG=j; try{localStorage.setItem("jfm-cfg-"+HOUSE.key,JSON.stringify(j))}catch(_){} render(); } }).catch(()=>{});
  /* versione offline: salva la guida sul telefono dopo la prima apertura */
  if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|anthropic/.test(location.hostname)){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();

</script>
