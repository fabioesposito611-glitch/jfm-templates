<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Domus Colosseum by JFM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{
  --bg:#F5F3EF; --card:#FFFFFF; --ink:#16213A; --muted:#5F6878; --line:#E6E2DA;
  --blue:#1C5DAA; --blue-soft:#EAF1FA; --or:#E9572A; --or-ink:#FFFFFF; --or-soft:#FDEEE7; --or-dark:#C9431B;
  --red:#C62828; --red-soft:#FDECEC; --ok:#1E8E5A;
  --r:18px; --shadow:0 1px 2px rgba(22,33,58,.06),0 6px 20px rgba(22,33,58,.06);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Instrument Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --card:#18213A; --ink:#EEF1F7; --muted:#A3ACBE; --line:#29334D;
  --blue-soft:#1B2A48; --or-soft:#3A2219; --red-soft:#3A1C1F; --shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
a{color:inherit}
b,strong{font-weight:700}
p{margin:0 0 10px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.01em}
.small{font-size:14px}.muted{color:var(--muted)}.mt{margin-top:12px}
.mono{font-family:var(--f-mono)}
svg{flex:none}

/* barra in alto */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%}
.brandname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.brandname b{font-family:var(--f-display);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandname span{font-size:12px;color:var(--or);font-weight:700;letter-spacing:.04em}
.lang{display:flex;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:6px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.snav{max-width:720px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px 10px;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);text-decoration:none;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap}
.snav a svg{width:18px;height:18px}
.snav a.on{background:var(--or);border-color:var(--or);color:var(--or-ink)}
.snav a.help:not(.on){border-color:var(--red);color:var(--red)}

main{max-width:720px;margin:0 auto;padding:16px 16px 40px}

/* pulsanti: sempre riconoscibili */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 14px 10px 16px;border-radius:14px;font:700 15px/1.2 var(--f-body);text-decoration:none;cursor:pointer;border:2px solid transparent;text-align:left}
.btn svg{width:19px;height:19px}
.btn .chev{width:18px;height:18px;margin-left:auto;opacity:.9}
.btn span{flex:1}
.btn.primary{background:var(--or);color:var(--or-ink);box-shadow:0 3px 0 var(--or-dark)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--or-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--ink)}
.btn.ghost svg:first-child{color:var(--or)}
.btn.sm{min-height:40px;padding:8px 12px}
.btn.sm .chev{display:none}
.btn.full{display:flex;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.col .btn{width:100%}

/* hero home */
.hero{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.2;background:var(--ink)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,21,36,0) 35%,rgba(15,21,36,.85))}
.hero-t{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hero-t span{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.hero-t h1{font-size:34px;font-weight:800;margin:8px 0 2px}
.hero-t p{margin:0;opacity:.9;font-size:14.5px}
.facts2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.facts2 div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.facts2 small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.facts2 b{font-family:var(--f-display);font-size:21px;font-weight:800}
.wifi2{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--card);border-radius:var(--r);padding:12px 12px 12px 14px;box-shadow:var(--shadow);border-left:5px solid var(--blue)}
.wic{width:42px;height:42px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.wic svg{width:24px;height:24px}
.wtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.wtx small{font-size:12px;color:var(--muted);font-weight:600}
.wtx b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtx .mono{font-size:15px;font-weight:700;word-break:break-all}

.musts{margin-top:18px}
.mh{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin-bottom:10px}
.mh svg{width:22px;height:22px;color:var(--or)}
.mgrid{display:grid;grid-template-columns:1fr;gap:8px}
.must{display:flex;gap:12px;align-items:flex-start;background:var(--or-soft);border-radius:14px;padding:12px 14px}
.mi{width:38px;height:38px;border-radius:11px;background:var(--or);color:#fff;display:grid;place-items:center}
.mi svg{width:21px;height:21px}
.must b{display:block;font-size:15.5px}
.must span{display:block;font-size:14px;color:var(--ink);opacity:.85}
@media (min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}

.tiles-h{font-size:20px;font-weight:800;margin:24px 0 10px}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:flex;align-items:center;gap:14px;padding:14px 12px 14px 14px;background:var(--card);border-radius:var(--r);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.tile:active{transform:scale(.99)}
.ti{width:46px;height:46px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.ti svg{width:24px;height:24px}
.tile div{flex:1;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.tile div span{display:block;font-size:13.5px;color:var(--muted);line-height:1.35}
.tile .chev{width:24px;height:24px;color:var(--or)}
.tile.hot{border-color:var(--or)}
.tile.hot .ti{background:var(--or);color:#fff}
.tile.help .ti{background:var(--red-soft);color:var(--red)}
.escal{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.escal svg{width:20px;height:20px;color:var(--or)}

/* pagina sezione */
.phead{display:flex;gap:14px;align-items:flex-start;margin:4px 0 16px}
.pic{width:52px;height:52px;border-radius:16px;background:var(--or);color:#fff;display:grid;place-items:center}
.pic svg{width:28px;height:28px}
.phead small{font-size:12px;font-weight:700;color:var(--or);letter-spacing:.06em}
.phead h1{font-size:27px;font-weight:800;margin:2px 0 4px}
.phead p{margin:0;font-size:14.5px;color:var(--muted)}
.pfoot{display:flex;flex-direction:column;gap:8px;margin-top:28px}

.h3b{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;margin:24px 0 10px;scroll-margin-top:130px}
.h3b svg{width:22px;height:22px;color:var(--or)}
.grp2{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:18px 0 8px}
.grp2 svg{width:20px;height:20px;color:var(--or)}

/* sotto-sezioni */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subnav a{padding:8px 13px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-decoration:none;font-weight:700;font-size:14px}
.subnav a.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* note */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--or-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:8px 0}
.note svg{width:20px;height:20px;color:var(--or);margin-top:1px}
.note.red{background:var(--red-soft)}
.note.red svg{color:var(--red)}

/* arrivo */
.astep{margin-bottom:26px}
.ash{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sn{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font:800 17px var(--f-display);flex:none}
.ash h3{font-size:21px;font-weight:800}
.pathbox{border-radius:var(--r);padding:12px;margin-top:10px;border:2px solid var(--line);background:var(--card)}
.pathbox.A{border-color:var(--blue)}
.pathbox.B{border-color:var(--or)}
.pth{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pth b{font-family:var(--f-display);font-size:18px}
.pl{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 16px var(--f-display);color:#fff;background:var(--blue)}
.pathbox.B .pl{background:var(--or)}
.fwrap{position:relative}
.fnum{position:absolute;top:10px;left:10px;min-width:32px;height:32px;padding:0 8px;border-radius:999px;background:var(--or);color:#fff;font:800 16px/32px var(--f-display);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ftx{padding:12px 4px 2px}
.ftx p{font-size:16.5px;line-height:1.45;margin:0}
.code{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.code .k{width:42px;height:50px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 26px var(--f-mono)}
.code .k.arrow{background:var(--or)}
.code .cap{width:100%;font-size:13px;color:var(--muted)}

/* carosello */
.car{position:relative}
.track{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;scroll-snap-align:start;min-width:0}
.car.one .slide{flex-basis:100%}
.pathbox .slide{flex-basis:90%}
.carnav{display:flex;align-items:center;gap:10px;margin-top:10px}
.cnt{flex:1;text-align:center;font-size:14px;color:var(--muted);font-weight:600}
.cnt b{color:var(--ink)}
.cbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 15px var(--f-body);padding:0 12px;cursor:pointer}
.cbtn svg{width:20px;height:20px}
.cbtn.next{background:var(--or);border-color:var(--or);color:#fff}
.cbtn:disabled{opacity:.3;cursor:default}
.zimg{display:block;width:100%;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--line);cursor:zoom-in}
.zimg img{width:100%;height:100%;object-fit:cover}
.zimg.ph{aspect-ratio:4/3}
.vbox{margin-top:12px}
.vlabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:6px;color:var(--or)}
.vlabel svg{width:18px;height:18px;fill:currentColor}
.vbox video{width:100%;max-height:440px;border-radius:14px;background:#000}

/* casa */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fcard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.fcard .zimg.fc{border-radius:0;aspect-ratio:4/3}
.fci{aspect-ratio:4/3;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.fci svg{width:38px;height:38px}
.fcard div{padding:9px 11px 11px}
.fcard b{display:block;font-size:14.5px}
.fcard div span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.room2{margin-bottom:22px}
.room2 h4{font-size:17px;font-weight:800;margin-bottom:8px}
.room2 p{margin-top:8px}

/* elenchi di posti: riga intera cliccabile */
.plist2{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;background:var(--card);border-radius:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.prow-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow-m b{font-size:15.5px}
.prow-m>span{font-size:13.5px;color:var(--muted)}
.prow-go{display:flex;align-items:center;gap:2px;color:var(--or)}
.prow-go svg{width:20px;height:20px}
.dists{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.dist{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--blue)}
.dist svg{width:15px;height:15px}
.fav{display:inline-block;background:var(--or);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:2px}
.metro{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;color:#fff;font:800 12px var(--f-display);vertical-align:-3px}
.metro.A{background:#E5571F}.metro.B{background:#1D4E9E}

/* check-out */
.costeps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.costeps li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.cn{width:28px;height:28px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font:800 15px var(--f-display);flex:none}
.ci{color:var(--blue)}.ci svg{width:22px;height:22px}
.costeps b{font-weight:600;font-size:15px}
.cases2{display:grid;gap:8px}
.case2{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.case2 b{display:flex;align-items:center;gap:8px;font-size:16px}
.case2 b svg{width:20px;height:20px;color:var(--or)}
.case2>span{display:block;font-size:14px;color:var(--muted);margin-top:4px}

/* zona */
.nearbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nearbar a{display:flex;flex-direction:column;padding:10px 12px;background:var(--card);border-radius:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0;border:1.5px solid var(--line)}
.nearbar span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearbar b{display:flex;align-items:center;gap:4px;font:800 18px var(--f-display)}
.nearbar b svg{width:16px;height:16px;color:var(--or)}
.gmap{margin-top:12px;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.3;background:var(--line);box-shadow:var(--shadow)}
.gmap iframe{width:100%;height:100%;border:0;display:block}

/* roma */
.it2{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);height:100%}
.it2 .zimg.cov{border-radius:0;aspect-ratio:16/9}
.it2b{padding:14px}
.it2 h4{font-size:19px;font-weight:800}
.when{font-size:13px;font-weight:700;color:var(--or);margin:2px 0 8px}
.route{list-style:none;counter-reset:r;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.route li{counter-increment:r;position:relative;padding-left:34px;display:flex;flex-direction:column}
.route li::before{content:counter(r);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font:800 13px var(--f-display)}
.route a{display:flex;align-items:center;gap:4px;font-weight:700;text-decoration:none;color:var(--ink)}
.route a .chev{width:16px;height:16px;color:var(--or)}
.route .rd{font-size:14px;color:var(--muted)}
.leg{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--blue);font-weight:600;margin-top:2px}
.leg svg{width:14px;height:14px}
.fact{background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.mvgrid{display:grid;gap:8px}
.mv{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.mv>b{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:4px}
.mv>b svg{width:20px;height:20px;color:var(--or)}
.mv>span{font-size:14.5px}
.fares{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fares div{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.fares .ours{border-color:var(--or);background:var(--or-soft)}
.fares small{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fares b{font:800 15.5px var(--f-display)}
.fares span{font-size:12.5px;color:var(--muted)}

/* info */
.icard{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;scroll-margin-top:130px}
.icard h4{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;margin-bottom:10px}
.icard h4 svg{width:22px;height:22px;color:var(--or)}
.taxrow{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.taxrow b{font:800 36px var(--f-display);color:var(--or)}
.taxrow span{font-size:14.5px}
.pay2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pay2 div{background:var(--bg);border-radius:12px;padding:10px}
.pay2 b{display:block;font-size:14px}.pay2 span{font-size:13px;color:var(--muted)}
.ref{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin:8px 0 0}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink)}
.qrcard img{width:100%;max-width:140px;background:#fff;border-radius:10px;padding:6px}
.qrcard b{font:800 16px var(--f-display);margin-top:6px}
.qrcard span{font-size:12.5px;color:var(--or);font-weight:700}
.share{display:flex;gap:12px;align-items:center}
.share img{width:110px;background:#fff;border-radius:10px;padding:6px;flex:none}
.share .col{flex:1;min-width:0}

/* aiuto */
.sos112{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--red);color:#fff;text-decoration:none}
.sos112>b{font:800 42px/1 var(--f-display)}
.sos112 div{flex:1}
.sos112 strong{display:block;font-size:15px}.sos112 span{display:block;font-size:13px;opacity:.92}
.sos112>svg{width:26px;height:26px}
.search{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}

  car:{
    it:"Dal Grande Raccordo Anulare: uscita Appia, poi Via Appia Nuova fino a Piazza San Giovanni in Laterano e da lì Via di San Giovanni in Laterano. La casa non ha parcheggio. In strada, lungo Via di San Giovanni in Laterano e nelle vie laterali, si parcheggia sulle strisce blu, a pagamento con parcometro o app nei giorni e negli orari indicati sui cartelli; nelle ore di punta trovare posto è difficile. Per lasciare l'auto qualche giorno conviene un garage: chiamatelo prima per disponibilità e prezzi. Potete fermarvi pochi minuti davanti al portone per scaricare i bagagli, poi spostate subito l'auto.",
    en:"From the GRA ring road: exit Appia, then Via Appia Nuova to Piazza San Giovanni in Laterano and from there Via di San Giovanni in Laterano. The apartment has no parking. On the street, along Via di San Giovanni in Laterano and the side streets, park in the blue bays, paid by meter or app on the days and hours shown on the signs; at rush hour spaces are hard to find. To leave the car for a few days, a garage is the better option: call ahead for availability and prices. You can stop for a couple of minutes outside the door to unload luggage, then move the car straight away.",
    es:"Desde el anillo GRA: salida Appia, luego Via Appia Nuova hasta Piazza San Giovanni in Laterano y desde allí Via di San Giovanni in Laterano. La casa no tiene aparcamiento. En la calle, por Via di San Giovanni in Laterano y las calles laterales, se aparca en las plazas azules, de pago con parquímetro o app en los días y horarios indicados en las señales; en hora punta es difícil encontrar sitio. Para dejar el coche varios días conviene un garaje: llamad antes para disponibilidad y precios. Podéis parar unos minutos delante del portal para descargar las maletas y luego mover el coche enseguida."
  },

function fmtM(m){ return m>=1000 ? (m/1000).toFixed(1).replace(".",LANG==="en"?".":",")+" km" : m+" m"; }
function dist(k, opts={}){
  const d = DIST[k]; if(!d) return "";
  const far = d.walk > 25;
  let s = "";
  if(!far || opts.alwaysWalk) s += `<span class="dist">${IC.walk}${d.walk} ${L(UI.min)} · ${fmtM(d.m)}</span>`;
  if(far && VIA[k]) s += `<span class="dist">${IC.train}${L(VIA[k])}</span>`;
  else if(!far && VIA[k] && opts.showVia) s += `<span class="dist">${IC.train}${L(VIA[k])}</span>`;
  if(far) s += `<span class="dist">${IC.taxi}${L({it:"taxi",en:"taxi",es:"taxi"})} ~${d.taxiMin} ${L(UI.min)} · €${d.taxi[0]}–${d.taxi[1]}</span>`;
  return `<span class="dists">${s}</span>`;
}

/* ---------- distanza tra due punti (stima a piedi, come per la casa) ---------- */
function legKm(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h))*1.2; }
function legHTML(from,to){ if(!LL[from]||!LL[to]) return ""; const km=legKm(LL[from],LL[to]), min=Math.max(1,Math.round(km*1000/78));
  if(min>30) return `<span class="leg">${IC.taxi}${L({it:"dalla tappa precedente: meglio in taxi o metro",en:"from the previous stop: best by taxi or metro",es:"desde la parada anterior: mejor en taxi o metro"})}</span>`;
  return `<span class="leg">${IC.walk}${min} ${L(UI.min)} ${L({it:"dalla tappa precedente",en:"from the previous stop",es:"desde la parada anterior"})}</span>`; }

function vArrivo(){
  const G=HOUSE.arrival; let out=goldenHTML(), step=0, i=0;
  while(i<G.length){
    const g=G[i];
    if(g.path){
      const paths=[]; while(i<G.length && G[i].path){ paths.push(G[i]); i++; }
      step++;
      out+=`<div class="astep"><div class="ash"><span class="sn">${step}</span><h3>${L({it:"Salite fino alla porta di casa",en:"Go up to the apartment door",es:"Subid hasta la puerta de casa"})}</h3></div>
        <p>${L({it:`Scegliete: <b>A con l'ascensore</b> oppure <b>B a piedi</b>.`,en:`Choose: <b>A by elevator</b> or <b>B on foot</b>.`,es:`Elegid: <b>A en ascensor</b> o <b>B a pie</b>.`})}</p>
        ${paths.map(p=>`<div class="pathbox ${p.path}"><div class="pth"><span class="pl">${p.path}</span><b>${L(p.title).replace(/^.*·\s*/,"")}</b></div>
          ${p.warn?note(p.warn,"red"):""}${p.intro?`<p>${L(p.intro)}</p>`:""}
          ${carousel(p.frames.map((f,k)=>frameHTML(f,k+1)))}</div>`).join("")}
      </div>`;
      continue;
    }
    step++;
    out+=`<div class="astep"><div class="ash"><span class="sn">${step}</span><h3>${L(g.title)}</h3></div>
      ${g.intro?`<p>${L(g.intro)}</p>`:""}

      ${g.warn?note(g.warn,"red"):""}
      ${carousel(g.frames.map((f,k)=>frameHTML(f,k+1)))}</div>`;
    i++;
  }
  return out;
}

function vItinerari(){
  const n=parseInt(SUB,10);
  if(n>=1 && n<=ITIN.length){
    const it=ITIN[n-1];
    return `<a class="btn ghost" href="#itinerari">${BACK}<span>${L({it:"Tutti gli itinerari",en:"All walks",es:"Todas las rutas"})}</span></a>
      <div class="itd">${it.cover?zoomImg(it.cover,"itcov"):""}<div class="itnum">${n}</div><h2>${L(it.title)}</h2><div class="when">${L(it.when)}</div>${it.intro?`<p>${L(it.intro)}</p>`:""}</div>
      <ol class="route big tl">${it.stops.map(([k,d],i)=>`<li><a href="${gm(P[k][0],P[k][1])}" target="_blank" rel="noopener"><span>${esc(P[k][0])}</span>${IC.pin}${CHEV}</a><span class="rd">${L(d)}</span>${i>0?legHTML(it.stops[i-1][0],k):dist(k,{showVia:true})}</li>`).join("")}</ol>
      ${it.alt?`<p class="small muted">${L(it.alt)}</p>`:""}
      ${it.fact?`<p class="fact">💡 ${L(it.fact)}</p>`:""}
      ${n<ITIN.length?`<a class="btn primary full mt" href="#itinerari/${n+1}"><span>${L({it:"Itinerario successivo",en:"Next walk",es:"Siguiente ruta"})}: ${L(ITIN[n].title)}</span>${CHEV}</a>`:""}`;
  }
  return `<p>${L({it:"Tre passeggiate che facciamo fare ai nostri amici quando vengono a Roma. Ogni tappa ha la distanza a piedi e si apre in Google Maps.",en:"Three walks we suggest to our own friends when they visit Rome. Every stop shows the walking distance and opens in Google Maps.",es:"Tres paseos que recomendamos a nuestros amigos cuando vienen a Roma. Cada parada tiene la distancia a pie y se abre en Google Maps."})}</p>
    <div class="itlist">${ITIN.map((it,i)=>`<a class="itc" href="#itinerari/${i+1}">${it.cover?`<span class="itth"><img src="img/${it.cover}.webp" alt="" loading="lazy"><i>${i+1}</i></span>`:`<span class="itth none"><i>${i+1}</i>${IC.map}</span>`}<div><b>${L(it.title)}</b><span class="when">${L(it.when)}</span><span class="stops">${it.stops.length} ${L({it:"tappe",en:"stops",es:"paradas"})} · ${it.stops.slice(0,3).map(s=>esc(P[s[0]][0].split(" ")[0]==="Basilica"?P[s[0]][0].replace("Basilica di ",""):P[s[0]][0])).join(", ")}…</span></div>${CHEV}</a>`).join("")}</div>`+vBiglietti();
}
function vBiglietti(){
  return `${h3(IC.star,{it:"Biglietti: solo dai siti ufficiali",en:"Tickets: official websites only",es:"Entradas: solo en las webs oficiales"})}
    <p class="small muted">${L({it:"Per Colosseo e Musei Vaticani conviene prenotare qualche giorno prima. Attenzione ai siti che sembrano ufficiali ma rivendono a prezzo più alto.",en:"For the Colosseum and the Vatican Museums it's best to book a few days ahead. Watch out for sites that look official but resell at higher prices.",es:"Para el Coliseo y los Museos Vaticanos conviene reservar unos días antes. Cuidado con las webs que parecen oficiales pero revenden más caro."})}</p>
    <div class="col">${btn("https://ticketing.colosseo.it/",L({it:"Colosseo, Foro Romano e Palatino",en:"Colosseum, Roman Forum and Palatine",es:"Coliseo, Foro Romano y Palatino"}),"ghost",IC.star)}${btn("https://www.museivaticani.va/",L({it:"Musei Vaticani e Cappella Sistina",en:"Vatican Museums and Sistine Chapel",es:"Museos Vaticanos y Capilla Sixtina"}),"ghost",IC.star)}${btn("https://portale.museiitaliani.it/b2c/",L({it:"Pantheon (portale Musei Italiani)",en:"Pantheon (Musei Italiani portal)",es:"Panteón (portal Musei Italiani)"}),"ghost",IC.star)}${btn(waLink(),L({it:"Tour guidati: chiedete a noi",en:"Guided tours: just ask us",es:"Visitas guiadas: preguntadnos"}),"ghost",IC.chat)}</div>`;
}
function vMangiare(){
  const order = HOUSE.foodFirst==="col" ? ["col","sg"] : ["sg","col"];
  const food=order.flatMap(g=>FOOD[g].items).sort((a,b)=>DIST[a[0]].walk-DIST[b[0]].walk)
    .map(([p,fav,cuis,price])=>row(p, esc(P[p][0])+(fav?` <span class="fav">${L(UI.fav)}</span>`:""), `${L(cuis)} · ${price}`, {showVia:true,ic:/pizz/i.test(L(cuis))?FIC.pizza:XI.fork}));
  return `<p class="small muted">${L({it:"Dal più vicino. Prezzi a persona. Toccate un posto per aprirlo in Maps.",en:"Nearest first. Prices per person. Tap a place to open it in Maps.",es:"Del más cercano. Precios por persona. Toca un sitio para abrirlo en Maps."})}</p>${moreList("food",food,8)}
    ${h3(svg('<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h6l3-7h3M9 7h4l2 3"/>'),{it:"Cibo a domicilio",en:"Food delivery",es:"Comida a domicilio"})}
    <p class="small">${L({it:"Stanchi dopo una giornata in giro? Potete ordinare a casa con queste app.",en:"Tired after a day out? You can order to the apartment with these apps.",es:"¿Cansados después de un día por ahí? Podéis pedir a casa con estas apps."})}</p>
    <div class="note">${PHONE}<span>${L({it:"<b>Importante:</b> il citofono non funziona bene. Quando ordinate, scrivete nelle note di <b>chiamarvi al telefono</b> appena il rider arriva, e scendete voi al portone.",en:"<b>Important:</b> the intercom doesn't work well. When you order, write in the notes that the rider should <b>call your phone</b> on arrival, and go down to the street door yourselves.",es:"<b>Importante:</b> el telefonillo no funciona bien. Al pedir, escribid en las notas que el repartidor os <b>llame al móvil</b> al llegar, y bajad vosotros al portal."})}</span></div>
    <div class="col">${btn("https://www.justeat.it/","Just Eat","ghost",FIC.pizza)}${btn("https://glovoapp.com/it/it/roma/","Glovo","ghost",FIC.pizza)}${btn("https://deliveroo.it/","Deliveroo","ghost",FIC.pizza)}</div>`;
}
function vBar(){ return DRINK.map((g,gi)=>`<h3 class="h3b">${FIC[g.ic]||""}<span>${L(g.t)}</span></h3>${moreList("dr"+gi,[...g.items].sort((a,b)=>DIST[a[0]].walk-DIST[b[0]].walk).map(([k,d])=>row(k,esc(P[k][0]),L(d),{showVia:true,ic:FIC[g.ic]})),4)}`).join(""); }
function vVedere(){ return `<div class="plist2">${[...VIEWS,...GEMS].map(([k,d])=>row(k,esc(P[k][0]),L(d),{showVia:true,ic:XI.view})).join("")}</div>`; }
function vTrasporti(){
  return `<div class="mvgrid">
      <div class="mv"><b>${IC.train}<span>Metro</span></b><span>${L({it:`<span class="metro A">A</span> San Giovanni · ${DIST.mSG.walk} min a piedi<br><span class="metro B">B</span> Colosseo · ${DIST.mCol.walk} min a piedi<br>Biglietto 1,50 € (100 min), o carta contactless ai tornelli.`,en:`<span class="metro A">A</span> San Giovanni · ${DIST.mSG.walk} min walk<br><span class="metro B">B</span> Colosseo · ${DIST.mCol.walk} min walk<br>Ticket €1.50 (100 min), or tap a contactless card.`,es:`<span class="metro A">A</span> San Giovanni · ${DIST.mSG.walk} min a pie<br><span class="metro B">B</span> Colosseo · ${DIST.mCol.walk} min a pie<br>Billete 1,50 € (100 min), o tarjeta contactless.`})}</span></div>
      <div class="mv"><b>${IC.taxi}<span>Taxi</span></b><span>${L({it:"In strada a Roma i taxi non si fermano col braccio alzato: si prendono ai parcheggi taxi o si chiamano con un'app. Tassametro da 3,50 €.",en:"In Rome you can't hail a taxi in the street: go to a taxi rank or book one with an app. The meter starts at €3.50.",es:"En Roma los taxis no se paran levantando la mano: se cogen en las paradas o se piden con una app. Taxímetro desde 3,50 €."})}</span></div>
    </div>
    ${h3(svg('<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>'),{it:"Scaricate l'app del taxi",en:"Download a taxi app",es:"Descargad una app de taxi"})}
    <p class="small muted">${L({it:"Meglio scaricarla prima di partire: vi registrate, mettete la carta e prenotate da soli in un attimo.",en:"Best to download it before your trip: sign up, add your card and book on your own in seconds.",es:"Mejor descargarla antes del viaje: os registráis, añadís la tarjeta y reserváis solos en un momento."})}</p>

    ${h3(IC.train,{it:"La metro in uno schema",en:"The metro at a glance",es:"El metro en un esquema"})}
    ${metroMap()}
    ${h3(IC.plane,{it:"Aeroporto ↔ casa",en:"Airport ↔ home",es:"Aeropuerto ↔ casa"})}
    <div class="fares">
      <div><small>Taxi</small><b>Fiumicino 65–70 €</b><b>Ciampino 45–55 €</b><span>${L({it:"Tariffa ufficiale 55 € e 40 €, ma nella pratica si spende di più. Max 4 persone.",en:"Official fare €55 and €40, but in practice you pay more. Max 4 people.",es:"Tarifa oficial 55 € y 40 €, pero en la práctica se paga más. Máx. 4 personas."})}</span></div>
      <div class="ours"><small>${L({it:"Il nostro transfer",en:"Our transfer",es:"Nuestro traslado"})}</small><b>${L({it:"Aeroporto 70–100 €",en:"Airport €70–100",es:"Aeropuerto 70–100 €"})}</b><b>${L({it:"Stazione 60–80 €",en:"Station €60–80",es:"Estación 60–80 €"})}</b><span>${L({it:"Minivan con autista, 5–7 persone.",en:"Minivan with driver, 5–7 people.",es:"Monovolumen con conductor, 5–7 personas."})}</span></div>
    </div>
    <p class="small">${L({it:`Treno: Leonardo Express Fiumicino → Termini (32 min, da 14 €), poi metro <span class="metro A">A</span> direzione Anagnina fino a San Giovanni.`,en:`Train: Leonardo Express Fiumicino → Termini (32 min, from €14), then metro <span class="metro A">A</span> towards Anagnina to San Giovanni.`,es:`Tren: Leonardo Express Fiumicino → Termini (32 min, desde 14 €), luego metro <span class="metro A">A</span> dirección Anagnina hasta San Giovanni.`})}</p>
    <div class="mt">${btn(waLink(),L({it:"Prenota il transfer",en:"Book the transfer",es:"Reservar el traslado"}),"primary full",IC.van)}</div>
    ${h3(IC.car,{it:"In auto e parcheggi",en:"By car and parking",es:"En coche y aparcamiento"})}
    <p class="small">${L(HOUSE.car)}</p><div class="plist2">${HOUSE.parking.map(k=>row(k,esc(P[k][0]),"",{ic:XI.park,icc:"bl"})).join("")}</div>`;
}
function metroMap(){
  const line=(c,from,walk,stops,dir)=>`<div class="mline ${c}"><div class="mhead"><span class="metro ${c}">${c}</span><b>${from}</b><small>${IC.walk}${walk} ${L(UI.min)} ${L({it:"da casa",en:"from home",es:"desde casa"})}</small></div>
    <div class="mtrack"><span class="mdot home">${IC.home}</span>${stops.map(([n,k])=>`<span class="mst"><i></i><b>${n}</b><small>${k} ${L({it:"fermate",en:"stops",es:"paradas"})}</small></span>`).join("")}</div>${dir?`<p class="small muted">${L(dir)}</p>`:""}</div>`;
  return line("A","San Giovanni",DIST.mSG.walk,[["Termini",3],["Spagna",6],["Ottaviano",9]],{it:"Direzione Battistini. Ottaviano è la fermata per il Vaticano.",en:"Towards Battistini. Ottaviano is the stop for the Vatican.",es:"Dirección Battistini. Ottaviano es la parada del Vaticano."})
   +line("B","Colosseo",DIST.mCol.walk,[["Cavour",1],["Termini",2]],{it:"Direzione Rebibbia/Jonio. Nell'altra direzione (Laurentina): Circo Massimo 1 fermata, Piramide 2.",en:"Towards Rebibbia/Jonio. The other way (Laurentina): Circo Massimo 1 stop, Piramide 2.",es:"Dirección Rebibbia/Jonio. En la otra dirección (Laurentina): Circo Massimo 1 parada, Piramide 2."});
}
function vSpesa(){ return `<div class="plist2">${HOUSE.shop.map(([k,d])=>row(k,esc(P[k][0]),L(d),{ic:IC.cart,icc:"bl"})).join("")}</div>`; }
function vBagagli(){

      ${row("polCelio",L({it:"Polizia · Commissariato Celio",en:"Police · Celio station",es:"Policía · Comisaría Celio"}),L({it:"Denunce furto o smarrimento",en:"Report theft or loss",es:"Denuncias de robo o pérdida"}),{ic:XI.shield,icc:"bl"})}
    </div>
    <div class="nums">${[["118",{it:"Ambulanza",en:"Ambulance",es:"Ambulancia"}],["113",{it:"Polizia",en:"Police",es:"Policía"}],["115",{it:"Pompieri",en:"Fire",es:"Bomberos"}]].map(([n,t])=>`<a href="tel:${n}"><b>${n}</b><span>${L(t)}</span></a>`).join("")}</div>
    ${h3(IC.info,{it:"Frasi utili in italiano",en:"Useful phrases in Italian",es:"Frases útiles en italiano"})}
    <div class="phrases">${[["Ho bisogno di un medico",{en:"I need a doctor",es:"Necesito un médico"}],["Chiamate un'ambulanza!",{en:"Call an ambulance!",es:"¡Llamen a una ambulancia!"}],["Dov'è la farmacia più vicina?",{en:"Where's the nearest pharmacy?",es:"¿Dónde está la farmacia más cercana?"}],["Mi hanno rubato il portafoglio",{en:"My wallet has been stolen",es:"Me han robado la cartera"}]].map(([it,tr])=>`<div><b>${it}</b>${LANG!=="it"?`<span>${tr[LANG]}</span>`:""}</div>`).join("")}</div>`;
}

/* ---------- pagina ---------- */
const VIEWS_BY={arrivo:vArrivo,casa:vCasa,foto:vFoto,checkout:vCheckout,zona:vZona,itinerari:vItinerari,mangiare:vMangiare,bar:vBar,vedere:vVedere,trasporti:vTrasporti,spesa:vSpesa,bagagli:vBagagli,info:vInfo,recensione:vRecensione,aiuto:vAiuto,sos:vSos};
function vPage(s,c){
  const i=ORDER.indexOf(s), nx=ORDER[i+1], a=APPS[s];
  return `<header class="phead"><span class="ai ${a.c}">${a.ic}</span><div><h1>${L(a.h)}</h1><p>${L(a.d)}</p></div></header>
    ${VIEWS_BY[s](c)}
    <div class="pfoot"><a class="btn primary full" href="#home">${IC.home}<span>${L({it:"Torna alla home",en:"Back to home",es:"Volver al inicio"})}</span>${CHEV}</a>
    ${nx?`<a class="btn ghost full" href="#${nx}">${APPS[nx].ic}<span>${L(APPS[nx].t)}</span>${CHEV}</a>`:""}</div>`;
}

/* ---------- render ---------- */
const LANGS=[["it","Italiano","🇮🇹"],["en","English","🇬🇧"],["es","Español","🇪🇸"]];
function footer2(){ return `<footer class="foot2"><img src="img/logo.png" alt="" width="28" height="28"><div><b>JF MANAGEMENT S.r.l.s.</b><span>jfmitalia.com</span></div></footer>`; }
function parseHash(){
  let h=decodeURIComponent((location.hash||"").replace("#",""));
  const alias={faq:"aiuto",contatti:"aiuto",roma:"itinerari",dove:"zona","recensione-airbnb":"recensione","recensione-booking":"recensione","roma/trasporti":"trasporti","roma/mangiare":"mangiare","roma/bagagli":"bagagli"};
  h=alias[h]||h;
  const [p,s]=h.split("/");
  PAGE = APPS[p] ? p : "home"; SUB=s||null;
}
function render(keepY){
  const y=window.scrollY; carN=0;
  document.documentElement.lang=LANG;
  const cur=LANGS.find(x=>x[0]===LANG);
  document.getElementById("langBtn").innerHTML=`${GLOBE}<span>${cur[2]} ${cur[1]}</span>`;
  const c=CFG?.casa||null;
  document.getElementById("pbar").innerHTML = PAGE==="home" ? "" : `<a class="backbtn" href="#home">${BACK}<span>Home</span></a><b>${L(APPS[PAGE].t)}</b>`;
  document.getElementById("pbar").hidden = PAGE==="home";
  document.getElementById("main").innerHTML=(PAGE==="home"?vHome(c):vPage(PAGE,c))+footer2();
  if(keepY) window.scrollTo(0,y);
}
function route(){ parseHash(); render(); const a=SUB&&document.getElementById(SUB); if(a) a.scrollIntoView(); else window.scrollTo(0,0); }
function langSheet(first){
  const el=document.getElementById("langSheet");
  el.innerHTML=`<div class="ls-in"><img src="img/logo.png" alt="" width="56" height="56"><h2>${esc(HOUSE.name)}</h2><p>Scegli la lingua · Choose your language · Elige tu idioma</p>
    ${LANGS.map(([k,n,f])=>`<button type="button" class="lbtn${k===LANG&&!first?" on":""}" data-lang="${k}"><span class="flag">${f}</span><b>${n}</b>${CHEV}</button>`).join("")}</div>`;
  el.hidden=false;
}

/* carosello */
function carUpdate(car){
  const tr=car.querySelector(".track"), n=tr.children.length; if(n<2) return;
  const w=tr.children[0].getBoundingClientRect().width+12;
  const i=Math.min(n-1,Math.round(tr.scrollLeft/w));
  const b=car.querySelector(".cnt b"); if(b) b.textContent=i+1;
  const pv=car.querySelector('[data-dir="-1"]'), nx=car.querySelector('[data-dir="1"]');
  if(pv) pv.disabled=i===0; if(nx) nx.disabled=i===n-1;
}
document.addEventListener("scroll",e=>{ const t=e.target; if(t.classList && t.classList.contains("track")){ clearTimeout(t._t); t._t=setTimeout(()=>carUpdate(t.parentElement),60); } },true);

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-copy],[data-zoom],[data-more],[data-car],[data-go],[data-lang],#langBtn"); if(!t) return;
  if(t.id==="langBtn"){ langSheet(false); return; }
  if(t.dataset.lang){ setLang(t.dataset.lang); document.getElementById("langSheet").hidden=true; return; }
  if(t.dataset.copy!==undefined){ const txt=t.dataset.copy, done=()=>toast(L(UI.copied));
    try{ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }catch(_){ fallbackCopy(txt,done); } }
  else if(t.dataset.zoom){ document.getElementById("lbImg").src=t.dataset.zoom; document.getElementById("lb").hidden=false; }
  else if(t.dataset.car){ const tr=document.getElementById(t.dataset.car).querySelector(".track"); tr.scrollBy({left:(tr.children[0].getBoundingClientRect().width+12)*(+t.dataset.dir),behavior:"smooth"}); }
  else if(t.dataset.go){ const sub={move:"trasporti",food:"mangiare",bags:"bagagli"};
    location.hash = t.dataset.sub2 ? (sub[t.dataset.sub2]||"home") : (APPS[t.dataset.go]?t.dataset.go:t.dataset.go==="roma"?"itinerari":"home"); }
  else if(t.dataset.more){ const box=document.getElementById(t.dataset.more), open=t.dataset.open==="1";
    box.querySelectorAll(".extra").forEach(x=>x.hidden=open); t.dataset.open=open?"0":"1";
    t.innerHTML=`<span>${open?`${L({it:"Mostra tutti",en:"Show all",es:"Ver todos"})} (${t.dataset.n})`:L({it:"Mostra meno",en:"Show less",es:"Ver menos"})}</span>${CHEV}`; }
});
document.addEventListener("input",e=>{ if(e.target.id==="faq-q"){ FAQ_Q=e.target.value; document.getElementById("faq-list").innerHTML=faqHTML(CFG?.casa); } });
function fallbackCopy(txt,done){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(_){} ta.remove(); }
document.getElementById("lb").addEventListener("click",()=>{document.getElementById("lb").hidden=true});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ document.getElementById("lb").hidden=true; } });
let toastT; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1600); }
function setLang(l){ LANG=l; try{localStorage.setItem("jfm-lang",l)}catch(_){} render(true); }
window.addEventListener("hashchange",route);
(function start(){
  /* prenotazione: il numero arriva nel link di Lodgify (?b=…); i codici li dà il server solo durante il soggiorno */
  const qs=new URLSearchParams(location.search);
  const SLUG=HOUSE.key, today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome"}).format(new Date());
  try{ BOOK=localStorage.getItem("jfm-b-"+SLUG); }catch(_){}
  if(/^\d{1,12}$/.test(qs.get("b")||"")){ BOOK=qs.get("b"); try{localStorage.setItem("jfm-b-"+SLUG,BOOK)}catch(_){} }
  try{ const c=JSON.parse(localStorage.getItem("jfm-codes-"+SLUG)||"null"); if(c && c.exp>=today) CODES=c.codes||{}; else localStorage.removeItem("jfm-codes-"+SLUG); }catch(_){}
  const qlang=qs.get("l");
  if(qs.toString()) history.replaceState(null,"",location.pathname+location.hash);
  let saved=null; try{saved=localStorage.getItem("jfm-lang")}catch(_){}
  if(qlang && ["it","en","es"].includes(qlang)){ saved=qlang; try{localStorage.setItem("jfm-lang",qlang)}catch(_){} }
  const nav=(navigator.language||"").toLowerCase();
  LANG = saved || (nav.startsWith("it")?"it":nav.startsWith("es")?"es":"en");
  try{ const s=localStorage.getItem("jfm-cfg-"+HOUSE.key); if(s) CFG=JSON.parse(s); }catch(_){}
  route();
  if(!saved) langSheet(true);
  fetch("/api/stay?h="+SLUG+(BOOK?"&b="+BOOK:""),{cache:"no-store",credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j) return;
    if(j.phase==="after"||j.phase==="invalid"){ try{["jfm-codes-","jfm-cfg-","jfm-b-"].forEach(k=>localStorage.removeItem(k+SLUG))}catch(_){} location.replace("/grazie/?h="+SLUG); return; }
    if(j.codes){ CODES=j.codes; try{localStorage.setItem("jfm-codes-"+SLUG,JSON.stringify({codes:j.codes,exp:j.departure||"9999-12-31"}))}catch(_){} render(true); }
    else if(j.phase==="before"){ CODES={}; try{localStorage.removeItem("jfm-codes-"+SLUG)}catch(_){} }
  }).catch(()=>{});
  fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ CFG=j; try{localStorage.setItem("jfm-cfg-"+HOUSE.key,JSON.stringify(j))}catch(_){} render(true); } }).catch(()=>{});
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
